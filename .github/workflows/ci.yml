name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool reads paths and timestamps, so Windows and POSIX both have to
        # be exercised, not just the runner that happens to be cheapest.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      # Reads the version pinned in package.json's packageManager field, so CI
      # and a contributor's machine run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The project has no dependencies, so this resolves to almost nothing. It
      # runs anyway to prove the lockfile is valid and in sync on every platform.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Parse every file
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Smoke test the CLI
        run: |
          node bin/agent-observer.js --version
          node bin/agent-observer.js --help
          node bin/agent-observer.js adapters --no-color
          node bin/agent-observer.js doctor --no-color

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate plugin and marketplace manifests
        run: pnpm run validate-plugin

      - name: Check every version declaration agrees
        run: pnpm run check-version

      # CLAUDE.md and AGENTS.md are how a contributing agent learns the rules of
      # this repository. A broken link there silently drops a rule.
      - name: Check the contributor documentation is intact
        run: pnpm run check-docs

      - name: Check the package publishes the files the plugin needs
        run: |
          pnpm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8')).files.map(f => f.path);
            const required = [
              'bin/agent-observer.js',
              'src/cli.js',
              '.claude-plugin/plugin.json',
              'skills/agent-observer/SKILL.md',
              'commands/subagent-report.md',
            ];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from the package: ' + missing.join(', ')); process.exit(1); }
            console.log('Package contains all ' + required.length + ' required files.');
          "

  claude-plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Informational: the CLI is not guaranteed installable on a runner, so a
    # failure here must not block a pull request. pnpm run validate-plugin is
    # the gate that does block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # dlx rather than a global install: it needs no PNPM_HOME on the runner,
      # and this is somebody else's CLI rather than a dependency of ours.
      #
      # --strict matches what the community-marketplace review pipeline runs, so
      # a red mark here means a submission would be rejected.
      - name: Validate the plugin
        run: pnpm dlx @anthropic-ai/claude-code plugin validate . --strict
