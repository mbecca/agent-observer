name: Release

# Tag a release to publish it:
#
#   npm version minor           # bumps package.json and tags vX.Y.Z
#   node scripts/sync-version.mjs   # propagates to the other manifests
#   git commit -am "Release vX.Y.Z" && git push --follow-tags
#
# The tag is the trigger. Everything below refuses to publish unless the tag,
# package.json, plugin.json, marketplace.json, src/version.js and the changelog
# all agree.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint, versions, manifests and tests
        run: npm run verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  publish-npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Re-check the tag against every manifest
        run: npm run check-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Publish
        # Skipped with a clear message rather than failing the run when the
        # token is not configured yet, so the GitHub release still happens.
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; skipping the npm publish."
            echo "Add a repository secret named NPM_TOKEN to enable it."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: github release
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the tarball
        run: npm pack

      - name: Extract this version's changelog section
        id: notes
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  marketplace:
    name: check the marketplace serves this release
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Claude Code resolves `/plugin marketplace add <owner>/<repo>` against the
      # default branch, and this repository is its own marketplace, so what main
      # says is what users install. Tagging a release without merging the version
      # bump to main would publish one version and serve another.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: main must declare the version that was just tagged
        run: |
          RELEASED="${GITHUB_REF_NAME#v}"
          ON_MAIN=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'agent-observer').version")
          echo "tag:  $RELEASED"
          echo "main: $ON_MAIN"
          if [ "$RELEASED" != "$ON_MAIN" ]; then
            echo ""
            echo "main still serves $ON_MAIN, so '/plugin install agent-observer' will"
            echo "not give people $RELEASED. Merge the release commit to main."
            exit 1
          fi
          echo "The marketplace on main serves the released version."

      - name: Everything on main is consistent
        run: npm run check-version
