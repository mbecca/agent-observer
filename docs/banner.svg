<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">agent-observer: what was planned, and what actually ran</title>
  <desc id="desc">A dashed panel shows an intended model routing plan: cheap to implement, stronger to review, strongest for a final pass. Below it, a solid panel shows the models that were actually recorded for each subagent, read from the agent's own metadata files on disk.</desc>

  <!--
    Colours are chosen so every coloured element is a filled shape carrying its
    own contrast, and every text colour is a mid tone legible on both a white
    and a dark background. The image therefore needs no light/dark variant.
  -->
  <defs>
    <style>
      .label { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; letter-spacing: 1.6px; fill: #7d8590; }
      .muted { font-size: 13px; fill: #7d8590; }
      .small { font-size: 11px; fill: #7d8590; }
      .chip { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .chiprole { font-size: 11px; fill: #7d8590; }
      .ghost { font-size: 12px; font-weight: 600; fill: #7d8590; }
    </style>
  </defs>

  <!-- ── planned ─────────────────────────────────────────────────────── -->
  <text x="24" y="26" class="label eyebrow">WHAT THE ORCHESTRATOR PLANNED</text>

  <rect x="20" y="38" width="840" height="74" rx="10"
        fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65"/>

  <g class="label">
    <rect x="44" y="60" width="150" height="30" rx="15" fill="#7d8590" opacity="0.16"/>
    <text x="119" y="80" class="ghost" text-anchor="middle">cheap to implement</text>

    <rect x="222" y="60" width="150" height="30" rx="15" fill="#7d8590" opacity="0.16"/>
    <text x="297" y="80" class="ghost" text-anchor="middle">stronger to review</text>

    <rect x="400" y="60" width="170" height="30" rx="15" fill="#7d8590" opacity="0.16"/>
    <text x="485" y="80" class="ghost" text-anchor="middle">strongest for the last pass</text>

    <text x="600" y="80" class="muted">…so the plan says</text>
  </g>

  <!-- ── the question ────────────────────────────────────────────────── -->
  <g>
    <path d="M 440 112 L 440 146" stroke="#7d8590" stroke-width="1.5" opacity="0.7"/>
    <path d="M 434 140 L 440 148 L 446 140" fill="none" stroke="#7d8590" stroke-width="1.5" opacity="0.7"/>
  </g>
  <text x="452" y="136" class="label muted">did it?</text>

  <!-- ── recorded ────────────────────────────────────────────────────── -->
  <text x="24" y="176" class="label eyebrow">WHAT ACTUALLY RAN</text>

  <rect x="20" y="188" width="840" height="86" rx="10"
        fill="#7d8590" fill-opacity="0.07" stroke="#7d8590" stroke-opacity="0.35" stroke-width="1.5"/>

  <g class="label">
    <!-- Each chip is one recorded subagent: its role, and the model tier the
         metadata says ran it. Green fast, amber standard, violet frontier. -->
    <text x="44" y="212" class="chiprole">implement</text>
    <rect x="40" y="220" width="104" height="30" rx="8" fill="#3fb950"/>
    <text x="92" y="240" class="chip" text-anchor="middle">fast</text>

    <text x="160" y="212" class="chiprole">review</text>
    <rect x="156" y="220" width="112" height="30" rx="8" fill="#d29922"/>
    <text x="212" y="240" class="chip" text-anchor="middle">standard</text>

    <text x="284" y="212" class="chiprole">implement</text>
    <rect x="280" y="220" width="104" height="30" rx="8" fill="#3fb950"/>
    <text x="332" y="240" class="chip" text-anchor="middle">fast</text>

    <text x="400" y="212" class="chiprole">review</text>
    <rect x="396" y="220" width="112" height="30" rx="8" fill="#d29922"/>
    <text x="452" y="240" class="chip" text-anchor="middle">standard</text>

    <text x="524" y="212" class="chiprole">implement</text>
    <rect x="520" y="220" width="104" height="30" rx="8" fill="#d29922"/>
    <text x="572" y="240" class="chip" text-anchor="middle">standard</text>

    <text x="640" y="212" class="chiprole">final review</text>
    <rect x="636" y="220" width="112" height="30" rx="8" fill="#a371f7"/>
    <text x="692" y="240" class="chip" text-anchor="middle">frontier</text>

    <!-- The fifth chip is the point of the whole image: the plan said cheap
         for implementation, and this one did not run cheap. -->
    <path d="M 572 254 l 0 6" stroke="#7d8590" stroke-width="1.2" opacity="0.8"/>
    <text x="520" y="270" class="small">the plan said cheap here</text>
  </g>

  <!-- ── the source ──────────────────────────────────────────────────── -->
  <g opacity="0.75">
    <path d="M 92 274 L 92 296 M 212 274 L 212 296 M 332 274 L 332 296 M 452 274 L 452 296 M 572 274 L 572 296 M 692 274 L 692 296"
          stroke="#7d8590" stroke-width="1.2" stroke-dasharray="3 4"/>
  </g>

  <g transform="translate(40, 298)">
    <path d="M 0 0 h 12 l 4 4 v 14 h -16 z" fill="none" stroke="#7d8590" stroke-width="1.3"/>
    <path d="M 12 0 v 4 h 4" fill="none" stroke="#7d8590" stroke-width="1.3"/>
  </g>
  <text x="66" y="313" class="label small">read from each subagent's own metadata, written by the agent, not from what it said it did</text>
</svg>
